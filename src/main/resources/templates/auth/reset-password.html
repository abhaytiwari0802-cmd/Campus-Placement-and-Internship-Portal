<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Set New Password')}"></head>
<body class="bg-light">
    <header th:replace="~{fragments/layout :: navbar}"></header>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="portal-card shadow-lg p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="rounded-circle bg-success-subtle text-success d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                            <i class="bi bi-shield-check fs-3"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Set New Password</h3>
                        <p class="small text-muted">Create a secure new password for your account</p>
                    </div>

                    <form th:action="@{/reset-password}" th:object="${confirmDto}" method="post">
                        <input type="hidden" th:field="*{token}">

                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-secondary">New Password</label>
                            <input type="password" th:field="*{newPassword}" class="form-control" placeholder="Min. 6 characters" required>
                            <div class="invalid-feedback d-block" th:errors="*{newPassword}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-secondary">Confirm New Password</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Re-enter password" required>
                            <div class="invalid-feedback d-block" th:errors="*{confirmPassword}"></div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-portal-primary py-2 fw-semibold">
                                <i class="bi bi-check-lg me-1"></i> Update &amp; Reset Password
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

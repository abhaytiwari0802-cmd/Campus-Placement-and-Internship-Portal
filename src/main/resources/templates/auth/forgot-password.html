<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot Password')}"></head>
<body class="bg-light">
    <header th:replace="~{fragments/layout :: navbar}"></header>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="portal-card shadow-lg p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="rounded-circle bg-warning-subtle text-warning d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                            <i class="bi bi-key-fill fs-3"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Password Recovery</h3>
                        <p class="small text-muted">Enter your registered email to generate a secure recovery token</p>
                    </div>

                    <form th:action="@{/forgot-password}" th:object="${resetRequestDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-secondary">Your Registered Email</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="name@campus.edu" required>
                            <div class="invalid-feedback d-block" th:errors="*{email}"></div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-portal-primary py-2 fw-semibold">
                                <i class="bi bi-envelope-paper me-1"></i> Generate Reset Token
                            </button>
                        </div>
                    </form>

                    <!-- Development direct link display -->
                    <div th:if="${resetLink}" class="alert alert-info mt-4 p-3 small">
                        <strong><i class="bi bi-link-45deg me-1"></i> Development Direct Reset:</strong>
                        <p class="mb-2">In testing/development mode, you can immediately proceed using this link:</p>
                        <a th:href="@{${resetLink}}" class="btn btn-sm btn-primary w-100">Click to Reset Password</a>
                    </div>

                    <div class="text-center mt-4">
                        <a th:href="@{/login}" class="small text-primary fw-semibold text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i> Return to Sign In
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

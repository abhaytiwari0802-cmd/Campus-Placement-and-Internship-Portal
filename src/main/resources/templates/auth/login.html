<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign In')}"></head>
<body class="bg-light">
    <header th:replace="~{fragments/layout :: navbar}"></header>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="portal-card shadow-lg p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="rounded-circle bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                            <i class="bi bi-shield-lock-fill fs-3"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Portal Authentication</h3>
                        <p class="small text-muted">Sign in to your role-based dashboard</p>
                    </div>

                    <!-- Spring Security Form Login -->
                    <form th:action="@{/login}" method="post">
                        <!-- Email Input -->
                        <div class="mb-3">
                            <label for="username" class="form-label small fw-semibold text-secondary">Registered Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-secondary"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="username" name="username" class="form-control" placeholder="name@campus.edu" required autofocus>
                            </div>
                        </div>

                        <!-- Password Input -->
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label for="password" class="form-label small fw-semibold text-secondary mb-0">Password</label>
                                <a th:href="@{/forgot-password}" class="small text-decoration-none text-primary">Forgot Password?</a>
                            </div>
                            <div class="input-group mt-1">
                                <span class="input-group-text bg-light text-secondary"><i class="bi bi-key"></i></span>
                                <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-portal-primary py-2 fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
                            </button>
                        </div>
                    </form>

                    <!-- Demonstration Quick Credentials Accordion -->
                    <div class="accordion mt-4 pt-3 border-top" id="demoAccountsAccordion">
                        <div class="accordion-item border-0">
                            <h2 class="accordion-header">
                                <button class="accordion-button collapsed py-2 px-3 small bg-light text-secondary rounded" type="button" data-bs-toggle="collapse" data-bs-target="#demoAccountsCollapse">
                                    <i class="bi bi-info-circle me-2 text-primary"></i> <strong>Seed Demo Credentials (Click to View)</strong>
                                </button>
                            </h2>
                            <div id="demoAccountsCollapse" class="accordion-collapse collapse" data-bs-parent="#demoAccountsAccordion">
                                <div class="accordion-body small p-3 bg-light mt-2 rounded">
                                    <p class="mb-1"><strong>Administrator:</strong> <code>admin@campus.edu</code> / <code>Admin@123</code></p>
                                    <p class="mb-1"><strong>Recruiter:</strong> <code>recruiter.google@tech.com</code> / <code>Recruiter@123</code></p>
                                    <p class="mb-0"><strong>Student:</strong> <code>student.rahul@campus.edu</code> / <code>Student@123</code></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <p class="small text-muted mb-0">Don't have an account yet?</p>
                        <a th:href="@{/register}" class="fw-semibold text-primary text-decoration-none">Create a New Account</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

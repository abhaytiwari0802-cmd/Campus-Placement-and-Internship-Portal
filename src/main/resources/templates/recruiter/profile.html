<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Recruiter Profile')}"></head>
<body>
    <header th:replace="~{fragments/layout :: navbar}"></header>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="portal-card p-4 p-md-5 bg-white">
                    <div class="d-flex align-items-center mb-4 border-bottom pb-3">
                        <div class="rounded-circle bg-success-subtle text-success d-inline-flex align-items-center justify-content-center me-3" style="width: 60px; height: 60px;">
                            <i class="bi bi-person-badge-fill fs-2"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold text-dark mb-0">Recruiter Professional Profile</h3>
                            <p class="small text-muted mb-0">Manage your hiring credentials and company association</p>
                        </div>
                    </div>

                    <form th:action="@{/recruiter/profile/update}" th:object="${profileDto}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Full Name *</label>
                                <input type="text" th:field="*{fullName}" class="form-control" required>
                                <div class="invalid-feedback d-block" th:errors="*{fullName}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Official Corporate Email (Read-only)</label>
                                <input type="email" th:field="*{email}" class="form-control bg-light" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Contact / Mobile Phone</label>
                                <input type="text" th:field="*{phone}" class="form-control" placeholder="+91 9876543210">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Official Desk / Office Phone</label>
                                <input type="text" th:field="*{officialPhone}" class="form-control" placeholder="+91 (022) 6758-9000">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Job Designation *</label>
                                <input type="text" th:field="*{designation}" class="form-control" required>
                                <div class="invalid-feedback d-block" th:errors="*{designation}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Department / Hiring Cadre</label>
                                <input type="text" th:field="*{department}" class="form-control" placeholder="e.g. University Relations / Campus Hiring">
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-semibold">Associated Company Entity</label>
                                <div class="p-3 bg-light rounded border d-flex justify-content-between align-items-center">
                                    <div>
                                        <strong class="d-block text-dark" th:text="${profileDto.companyName}">Google India Pvt Ltd</strong>
                                        <small class="text-muted">Verification Status: <span class="badge bg-secondary" th:text="${profileDto.companyStatus}">APPROVED</span></small>
                                    </div>
                                    <a th:href="@{/recruiter/company}" class="btn btn-sm btn-outline-primary">Manage Company Details</a>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-success px-4 fw-semibold">
                                <i class="bi bi-save me-1"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

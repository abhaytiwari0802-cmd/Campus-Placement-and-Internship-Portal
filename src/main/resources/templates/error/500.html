<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('System Error (500)')}"></head>
<body>
    <header th:replace="~{fragments/layout :: navbar}"></header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7 text-center">
                <div class="portal-card p-5 bg-white shadow-sm border-0">
                    <div class="text-secondary mb-4">
                        <i class="bi bi-gear-wide-connected" style="font-size: 5rem;"></i>
                    </div>
                    <span class="badge bg-secondary-subtle text-secondary px-3 py-1 rounded-pill fw-semibold mb-2">HTTP 500 Server Error</span>
                    <h1 class="fw-bold text-dark mb-3">Something Went Wrong</h1>
                    <p class="text-muted mb-4 lead" th:text="${message != null ? message : 'An unexpected error occurred while processing your request. The placement system administration has logged this event.'}">
                        An internal server error occurred.
                    </p>
                    <div class="d-flex justify-content-center gap-3">
                        <a th:href="@{/}" class="btn btn-primary px-4">
                            <i class="bi bi-house-door me-1"></i> Return to Safety
                        </a>
                        <a th:href="@{/contact}" class="btn btn-outline-secondary px-4">
                            <i class="bi bi-envelope me-1"></i> Contact TPO Helpdesk
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
